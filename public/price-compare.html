<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a73e8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Cenový Porovnávač</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/static/icons/icon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1a73e8;
            --primary-dark: #1557b0;
            --bg: #f5f7fa;
            --card: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #5f6368;
            --border: #e0e0e0;
            --success: #0d9f4f;
            --discount: #d93025;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        /* Header */
        .header {
            background: var(--primary);
            color: white;
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 12px;
            opacity: 0.85;
        }

        /* Search */
        .search-container {
            padding: 16px 20px;
            position: sticky;
            top: 68px;
            z-index: 90;
            background: var(--bg);
        }

        .search-box {
            display: flex;
            background: var(--card);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 2px solid transparent;
            transition: border-color 0.2s;
        }

        .search-box:focus-within {
            border-color: var(--primary);
        }

        .search-box input {
            flex: 1;
            border: none;
            padding: 14px 16px;
            font-size: 16px;
            outline: none;
            background: transparent;
        }

        .search-box button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .search-box button:hover {
            background: var(--primary-dark);
        }

        /* Quick categories */
        .categories {
            padding: 0 20px 12px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .categories::-webkit-scrollbar { display: none; }

        .cat-chip {
            white-space: nowrap;
            padding: 8px 16px;
            background: var(--card);
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: all 0.2s;
            color: var(--text-secondary);
        }

        .cat-chip:hover, .cat-chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Results */
        .results-header {
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .results-header h2 {
            font-size: 16px;
            color: var(--text-secondary);
        }

        .results-header .count {
            font-size: 13px;
            color: var(--text-secondary);
            background: var(--card);
            padding: 4px 10px;
            border-radius: 12px;
        }

        .results-list {
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Product card */
        .product-card {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            box-shadow: var(--shadow);
            display: flex;
            gap: 14px;
            align-items: center;
            transition: transform 0.15s;
            position: relative;
            overflow: hidden;
        }

        .product-card:active {
            transform: scale(0.98);
        }

        .product-card.best-price {
            border: 2px solid var(--success);
        }

        .best-badge {
            position: absolute;
            top: 0;
            right: 0;
            background: var(--success);
            color: white;
            font-size: 10px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 0 0 0 8px;
            text-transform: uppercase;
        }

        .store-logo {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: white;
            font-size: 12px;
            flex-shrink: 0;
            text-align: center;
            line-height: 1.1;
        }

        .product-info {
            flex: 1;
            min-width: 0;
        }

        .product-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .product-meta {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .product-unit {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .product-valid {
            font-size: 11px;
            color: var(--text-secondary);
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .price-section {
            text-align: right;
            flex-shrink: 0;
        }

        .price-current {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary);
        }

        .price-original {
            font-size: 12px;
            color: var(--text-secondary);
            text-decoration: line-through;
        }

        .discount-badge {
            display: inline-block;
            background: var(--discount);
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 2px;
        }

        /* Savings summary */
        .savings-card {
            margin: 16px 20px;
            background: linear-gradient(135deg, var(--success), #06c167);
            color: white;
            border-radius: 12px;
            padding: 16px;
            box-shadow: var(--shadow);
        }

        .savings-card h3 {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 4px;
        }

        .savings-amount {
            font-size: 28px;
            font-weight: 800;
        }

        .savings-detail {
            font-size: 12px;
            opacity: 0.85;
            margin-top: 4px;
        }

        /* Popular searches */
        .popular-section {
            padding: 20px;
        }

        .popular-section h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: var(--text-secondary);
        }

        .popular-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .popular-item {
            background: var(--card);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: transform 0.15s;
        }

        .popular-item:active {
            transform: scale(0.96);
        }

        .popular-item .emoji {
            font-size: 28px;
            margin-bottom: 6px;
        }

        .popular-item .label {
            font-size: 13px;
            font-weight: 600;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        /* Bottom nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card);
            border-top: 1px solid var(--border);
            display: flex;
            padding: 8px 0;
            padding-bottom: max(8px, env(safe-area-inset-bottom));
            z-index: 100;
        }

        .nav-item {
            flex: 1;
            text-align: center;
            padding: 6px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 10px;
            transition: color 0.2s;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-item .nav-icon {
            font-size: 20px;
            display: block;
            margin-bottom: 2px;
        }

        /* Install banner */
        .install-banner {
            display: none;
            margin: 12px 20px;
            background: var(--card);
            border-radius: 12px;
            padding: 14px 16px;
            box-shadow: var(--shadow);
            align-items: center;
            gap: 12px;
            border: 1px solid var(--primary);
        }

        .install-banner.show { display: flex; }

        .install-banner .info { flex: 1; }
        .install-banner .info h4 { font-size: 14px; }
        .install-banner .info p { font-size: 12px; color: var(--text-secondary); }

        .install-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }

        .dismiss-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>Cenovy Porovnavac</h1>
    <p>Najdi najlepsiu cenu v slovenskych obchodoch</p>
</div>

<div class="search-container">
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Hladaj produkt (napr. mlieko, kuraca prsia...)" autocomplete="off">
        <button onclick="doSearch()">Hladaj</button>
    </div>
</div>

<div class="categories" id="categories">
    <div class="cat-chip active" onclick="selectCategory('')">Vsetko</div>
    <div class="cat-chip" onclick="selectCategory('Mliecne vyrobky')">Mliecne</div>
    <div class="cat-chip" onclick="selectCategory('Maso')">Maso</div>
    <div class="cat-chip" onclick="selectCategory('Ovocie a zelenina')">Ovocie</div>
    <div class="cat-chip" onclick="selectCategory('Napoje')">Napoje</div>
    <div class="cat-chip" onclick="selectCategory('Potraviny')">Potraviny</div>
    <div class="cat-chip" onclick="selectCategory('Pecivo')">Pecivo</div>
    <div class="cat-chip" onclick="selectCategory('Drogeria')">Drogeria</div>
</div>

<div class="install-banner" id="installBanner">
    <div class="info">
        <h4>Nainstaluj si appku</h4>
        <p>Pridaj na plochu pre rychly pristup</p>
    </div>
    <button class="install-btn" id="installBtn">Instalovat</button>
    <button class="dismiss-btn" onclick="dismissInstall()">&times;</button>
</div>

<div id="content">
    <!-- Dynamic content -->
</div>

<div class="bottom-nav">
    <div class="nav-item active" onclick="showHome()">
        <span class="nav-icon">&#x1F3E0;</span>
        Domov
    </div>
    <div class="nav-item" onclick="showAllDeals()">
        <span class="nav-icon">&#x1F525;</span>
        Akcie
    </div>
    <div class="nav-item" onclick="showStores()">
        <span class="nav-icon">&#x1F6D2;</span>
        Obchody
    </div>
</div>

<script>
    const searchInput = document.getElementById('searchInput');
    const content = document.getElementById('content');
    let currentCategory = '';
    let deferredPrompt;
    const FALLBACK_STORES = [
        { id: 'lidl', name: 'Lidl', color: '#0050aa' },
        { id: 'kaufland', name: 'Kaufland', color: '#e10a14' },
        { id: 'billa', name: 'Billa', color: '#cd1719' },
        { id: 'tesco', name: 'Tesco', color: '#00539f' },
        { id: 'coop', name: 'COOP Jednota', color: '#e30613' },
        { id: 'penny', name: 'Penny Market', color: '#cd1414' },
    ];
    const FALLBACK_DEALS = [
        { name: 'Mlieko polotucne 1,5% 1l', price: 0.89, original_price: 1.19, unit: '1 l', store: 'Lidl', store_id: 'lidl', category: 'Mliecne vyrobky', valid_until: '2026-05-31', discount_percent: 25 },
        { name: 'Mlieko cerstve polotucne 1l', price: 0.99, original_price: 1.29, unit: '1 l', store: 'Kaufland', store_id: 'kaufland', category: 'Mliecne vyrobky', valid_until: '2026-05-31', discount_percent: 23 },
        { name: 'Kuracie prsia 1kg', price: 4.99, original_price: 7.49, unit: '1 kg', store: 'Lidl', store_id: 'lidl', category: 'Maso', valid_until: '2026-05-31', discount_percent: 33 },
        { name: 'Kuracie prsia bez kosti 1kg', price: 5.49, original_price: 7.99, unit: '1 kg', store: 'Kaufland', store_id: 'kaufland', category: 'Maso', valid_until: '2026-05-31', discount_percent: 31 },
        { name: 'Banany 1kg', price: 0.99, original_price: 1.49, unit: '1 kg', store: 'Lidl', store_id: 'lidl', category: 'Ovocie a zelenina', valid_until: '2026-05-31', discount_percent: 34 },
        { name: 'Chlieb razny 500g', price: 0.89, original_price: 1.29, unit: '500 g', store: 'Lidl', store_id: 'lidl', category: 'Pecivo', valid_until: '2026-05-31', discount_percent: 31 },
        { name: 'Coca-Cola 1.5l', price: 1.19, original_price: 1.79, unit: '1.5 l', store: 'Tesco', store_id: 'tesco', category: 'Napoje', valid_until: '2026-05-31', discount_percent: 34 },
        { name: 'Nutella 350g', price: 2.89, original_price: 3.99, unit: '350 g', store: 'Billa', store_id: 'billa', category: 'Potraviny', valid_until: '2026-05-31', discount_percent: 27 },
    ];

    function normalizeText(value) {
        return (value || '')
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .toLowerCase();
    }

    function getFallbackDeals({ query = '', category = '', store = '' } = {}) {
        const q = normalizeText(query).trim();
        const cat = normalizeText(category).trim();
        const st = normalizeText(store).trim();

        let deals = [...FALLBACK_DEALS];
        if (cat) deals = deals.filter(d => normalizeText(d.category) === cat);
        if (st) deals = deals.filter(d => normalizeText(d.store_id) === st);
        if (q) deals = deals.filter(d => normalizeText(d.name).includes(q) || normalizeText(d.category).includes(q));
        deals.sort((a, b) => a.price - b.price);
        return deals;
    }

    async function fetchJsonWithFallback(url, fallbackFactory) {
        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error('API request failed');
            return await res.json();
        } catch {
            return fallbackFactory();
        }
    }

    // PWA install
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        document.getElementById('installBanner').classList.add('show');
    });

    document.getElementById('installBtn').addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            await deferredPrompt.userChoice;
            deferredPrompt = null;
            document.getElementById('installBanner').classList.remove('show');
        }
    });

    function dismissInstall() {
        document.getElementById('installBanner').classList.remove('show');
    }

    // Search
    searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') doSearch();
    });

    async function doSearch() {
        const query = searchInput.value.trim();
        if (!query) {
            showHome();
            return;
        }

        content.innerHTML = '<div class="loading"><div class="spinner"></div>Hladam najlepsie ceny...</div>';

        const data = await fetchJsonWithFallback(
            `/api/search?q=${encodeURIComponent(query)}`,
            () => ({ results: getFallbackDeals({ query }) }),
        );
        renderResults(data.results || [], `Vysledky pre "${query}"`);
    }

    function selectCategory(cat) {
        currentCategory = cat;
        document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
        event.target.classList.add('active');

        if (!cat) {
            showHome();
            return;
        }

        content.innerHTML = '<div class="loading"><div class="spinner"></div>Nacitavam...</div>';

        fetchJsonWithFallback(
            `/api/deals?category=${encodeURIComponent(cat)}`,
            () => ({ deals: getFallbackDeals({ category: cat }) }),
        ).then(data => renderResults(data.deals || [], cat));
    }

    function renderResults(results, title) {
        if (!results.length) {
            content.innerHTML = '<div class="empty-state"><div class="icon">&#x1F50D;</div><p>Ziadne vysledky. Skus iny nazov.</p></div>';
            return;
        }

        const bestPrice = results[0]?.price;
        const worstPrice = results[results.length - 1]?.price;
        const savings = worstPrice - bestPrice;

        let html = '';

        if (results.length > 1 && savings > 0) {
            html += `
                <div class="savings-card">
                    <h3>Mozes usetrit az</h3>
                    <div class="savings-amount">${savings.toFixed(2)} &euro;</div>
                    <div class="savings-detail">Najlepsia cena v ${results[0].store} vs najdrahsia v ${results[results.length-1].store}</div>
                </div>
            `;
        }

        html += `
            <div class="results-header">
                <h2>${title}</h2>
                <span class="count">${results.length} ponuk</span>
            </div>
            <div class="results-list">
        `;

        const storeColors = {
            lidl: '#0050aa',
            kaufland: '#e10a14',
            billa: '#cd1719',
            tesco: '#00539f',
            coop: '#e30613',
            penny: '#cd1414',
        };

        results.forEach((item, i) => {
            const isBest = i === 0 && results.length > 1;
            const color = storeColors[item.store_id] || '#666';

            html += `
                <div class="product-card ${isBest ? 'best-price' : ''}">
                    ${isBest ? '<div class="best-badge">Najlepsia cena</div>' : ''}
                    <div class="store-logo" style="background:${color}">${item.store.substring(0, 3).toUpperCase()}</div>
                    <div class="product-info">
                        <div class="product-name">${item.name}</div>
                        <div class="product-meta">
                            <span class="product-unit">${item.unit}</span>
                            <span class="product-valid">do ${formatDate(item.valid_until)}</span>
                        </div>
                    </div>
                    <div class="price-section">
                        <div class="price-current">${item.price.toFixed(2)}&euro;</div>
                        <div class="price-original">${item.original_price.toFixed(2)}&euro;</div>
                        <div class="discount-badge">-${item.discount_percent}%</div>
                    </div>
                </div>
            `;
        });

        html += '</div>';
        content.innerHTML = html;
    }

    function formatDate(dateStr) {
        const d = new Date(dateStr);
        return `${d.getDate()}.${d.getMonth() + 1}.`;
    }

    // Home page
    function showHome() {
        const popular = [
            { emoji: '&#x1F95B;', label: 'Mlieko', query: 'mlieko' },
            { emoji: '&#x1F357;', label: 'Kuraca prsia', query: 'kuracia prsia' },
            { emoji: '&#x1F34C;', label: 'Banany', query: 'banany' },
            { emoji: '&#x1F9C8;', label: 'Maslo', query: 'maslo' },
            { emoji: '&#x1F9C0;', label: 'Syr', query: 'syr' },
            { emoji: '&#x1F35E;', label: 'Chlieb', query: 'chlieb' },
            { emoji: '&#x1F964;', label: 'Coca-Cola', query: 'coca-cola' },
            { emoji: '&#x1F95C;', label: 'Nutella', query: 'nutella' },
        ];

        let html = `
            <div class="popular-section">
                <h3>Popularny hladany tovar</h3>
                <div class="popular-grid">
        `;

        popular.forEach(item => {
            html += `
                <div class="popular-item" onclick="quickSearch('${item.query}')">
                    <div class="emoji">${item.emoji}</div>
                    <div class="label">${item.label}</div>
                </div>
            `;
        });

        html += '</div></div>';
        content.innerHTML = html;

        setActiveNav(0);
    }

    function quickSearch(query) {
        searchInput.value = query;
        doSearch();
    }

    async function showAllDeals() {
        setActiveNav(1);
        content.innerHTML = '<div class="loading"><div class="spinner"></div>Nacitavam akcie...</div>';

        const data = await fetchJsonWithFallback('/api/deals', () => ({ deals: getFallbackDeals() }));
        renderResults(data.deals || [], 'Vsetky akcie');
    }

    async function showStores() {
        setActiveNav(2);
        const data = await fetchJsonWithFallback('/api/stores', () => ({ stores: FALLBACK_STORES }));
        let html = '<div class="popular-section"><h3>Podporovane obchody</h3><div class="results-list">';
        (data.stores || []).forEach(store => {
            html += `
                <div class="product-card" onclick="filterByStore('${store.id}')">
                    <div class="store-logo" style="background:${store.color}">${store.name.substring(0, 3).toUpperCase()}</div>
                    <div class="product-info">
                        <div class="product-name">${store.name}</div>
                        <div class="product-meta">
                            <span class="product-unit">Zobrazit akcie</span>
                        </div>
                    </div>
                    <div class="price-section">
                        <span style="font-size:20px;color:var(--text-secondary)">&#x27A1;</span>
                    </div>
                </div>
            `;
        });
        html += '</div></div>';
        content.innerHTML = html;
    }

    async function filterByStore(storeId) {
        content.innerHTML = '<div class="loading"><div class="spinner"></div>Nacitavam...</div>';
        const data = await fetchJsonWithFallback(
            `/api/deals?store=${storeId}`,
            () => ({ deals: getFallbackDeals({ store: storeId }) }),
        );
        const storeName = data.deals?.[0]?.store || storeId;
        renderResults(data.deals || [], `Akcie - ${storeName}`);
    }

    function setActiveNav(index) {
        document.querySelectorAll('.nav-item').forEach((item, i) => {
            item.classList.toggle('active', i === index);
        });
    }

    // Init
    showHome();
    const initialQuery = new URLSearchParams(window.location.search).get('q');
    if (initialQuery) {
        searchInput.value = initialQuery;
        doSearch();
    }

    // Register service worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
    }
</script>
</body>
</html>
