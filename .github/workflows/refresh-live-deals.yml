name: Refresh live deals data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh feed
        env:
          LIVE_DEALS_URLS: ${{ secrets.LIVE_DEALS_URLS }}
        run: python scripts/update_live_deals.py

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/live_deals.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live_deals.json
          git commit -m "chore: refresh live deals data"
          git push
